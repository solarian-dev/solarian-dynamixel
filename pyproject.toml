[project]
name = "solarian-dynamixel"
version = "0.1.0"
description = "Dynamixel servo actuator and bus plugin for Solarian robotics framework"
authors = [
    {name = "Raul Garreta", email = "raul@solarian.dev"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = [
    "solarian>=0.1.0",
    "pyserial>=3.5",
    "deepdiff",
]

[project.optional-dependencies]
# Only the machine wired to the servos needs the vendor SDK: the driver imports
# dynamixel_sdk inside the methods that talk to the bus, so the module classes
# import without it.
hardware = [
    "dynamixel-sdk>=3.7.31",
]

[project.entry-points."solarian.actuators"]
dynamixel = "solarian_dynamixel.actuator:DynamixelServo"

[project.entry-points."solarian.actuator_buses"]
dynamixel = "solarian_dynamixel.bus:DynamixelBus"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
